[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automatizacion-pqrs"
version = "1.0.0"
description = "Automatización de PQRS - Planeación"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Tu Nombre", email = "tu.email@ejemplo.com"}
]
keywords = ["pqrs", "automatización", "excel", "planeación"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/tu-usuario/automatizacion-pqrs"

[project.scripts]
automatizacion-pqrs = "pqrsd.main:main"

[tool.setuptools.packages.find]
where = ["pqrsd"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",   # ignorado por black
    "W503",   # ignorado por black
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
]
[tool.coverage.report]
fail_under = 50

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PTH", # flake8-use-pathlib
    "PL",  # pylint
    "RUF", # ruff-specific
]
ignore = [
    "D203",     # conflicto con D211
    "D213",     # conflicto con D212
    "DTZ007",   # fechas naive de Excel
    "E501",     # line-too-long (black lo maneja)
    "B008",     # function-call-in-default-argument
    "PLC0415",  # imports en funciones (lazy loading intencional)
    "RUF100",   # noqa sin usar
    "N806",     # variables MAYÚSCULAS en funciones
    "PLR2004",  # magic values (rangos de Excel)
    "PTH110",   # os.path.exists
    "PTH108",   # os.unlink
    "RET503", "RET504", "RET505", "RET506",
    "SIM300",   # Yoda condition
    "PLR0912",  # demasiadas ramas
    "I001",     # isort lo maneja
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]  # permitir assert y magic values en tests

[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google.*",
    "google_auth_oauthlib.*",
    "google.auth.*",
    "google.oauth2.*",
    "pandas.*",
    "openpyxl.*",
]
ignore_missing_imports = true